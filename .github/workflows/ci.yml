# Author: Bob Robert.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Release authorization regression checks
        run: python3 -m unittest discover -s tools -p 'test_release_guard.py' -v
      - name: Install exact application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Block known high or critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Generate local Prisma client without a database mutation
        run: npm exec --offline -- prisma generate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Payment configuration regression checks without provider calls
        run: npm test
      - name: Build
        run: npm run build
